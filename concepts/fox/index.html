<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>狐娘桌宠 · 概念示例</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background:
      radial-gradient(90% 70% at 78% 16%, #ffe9f2 0, transparent 60%),
      radial-gradient(80% 70% at 16% 90%, #fff4e0 0, transparent 62%),
      #f7f3f8;
    font-family: ui-sans-serif, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage { position: relative; width: 720px; height: 900px; }
  .tag {
    position: absolute; left: 34px; top: 28px; color: #7b6470;
    font-size: 12px; line-height: 1.7; letter-spacing: .04em;
  }
  .tag b { display: block; color: #3f2b36; font-size: 16px; letter-spacing: .08em; }
  .tag span { color: #b08d9d; }

  .pet { position: absolute; left: 50%; top: 52%; width: 330px; transform: translate(-50%, -50%); }
  .art { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 16px 18px #6b3b5a1f); animation: float 5.6s ease-in-out infinite; }
  .layer { transition: transform .6s cubic-bezier(.2,.9,.22,1.02); }
  .explode .layer-tail { transform: translate(26px, -6px) rotate(5deg); }
  .explode .layer-hair { transform: translate(-18px, -3px) rotate(-2deg); }
  .explode .layer-body { transform: translate(0, 14px); }
  .explode .layer-arms { transform: translate(-14px, 8px); }
  .explode .layer-orb { transform: translate(8px, -16px); }
  .explode .layer-head { transform: translate(0, -34px); }
  .explode .art { animation-play-state: paused; }
  .labels { opacity: 0; transition: opacity .3s .2s; }
  .explode .labels { opacity: 1; }
  .labels rect { fill: #fffdfbF2; stroke: #d98aa4; stroke-width: .7; }
  .labels text { fill: #6d4352; font: 600 7.5px/1 ui-sans-serif, "PingFang SC", sans-serif; text-anchor: middle; letter-spacing: .05em; }

  #hairBack { transform-box: view-box; transform-origin: 120px 76px; animation: hair 6.4s ease-in-out infinite; }
  #tail { transform-box: view-box; transform-origin: 154px 262px; animation: tail 4.2s ease-in-out infinite; }
  #body { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 4.6s ease-in-out infinite; }
  #head { transform-box: view-box; transform-origin: 120px 170px; animation: head 6s ease-in-out infinite; }
  #sleeves { transform-box: view-box; transform-origin: 120px 206px; animation: sleeves 5.4s ease-in-out infinite; }
  .ear-l { transform-box: view-box; transform-origin: 70px 64px; animation: ear-l 4.8s ease-in-out infinite; }
  .ear-r { transform-box: view-box; transform-origin: 170px 64px; animation: ear-r 5.2s ease-in-out infinite; }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 6.2s infinite; }
  .eye:nth-of-type(2) { animation-delay: .07s; }
  .petals g { transform-box: fill-box; transform-origin: center; animation: petal 7s ease-in-out infinite; }
  .petals g:nth-child(2) { animation-delay: -2.4s; animation-duration: 8.2s; }
  .petals g:nth-child(3) { animation-delay: -4.8s; animation-duration: 6.4s; }
  .petals g:nth-child(4) { animation-delay: -1.2s; animation-duration: 9s; }
  .orb-glow { animation: orb 3.4s ease-in-out infinite; }
  .orb-ring { opacity: 0; }
  .pet[data-state="working"] .orb-glow { animation-duration: 1.5s; }
  .pet[data-state="working"] .orb-ring { opacity: 1; animation: spin 9s linear infinite; transform-box: view-box; transform-origin: 120px 231px; }
  .pet[data-state="working"] .art { animation: work 2.6s ease-in-out infinite; }
  .pet[data-state="working"] .brows { display: none; }
  .pet[data-state="working"] .brows-focus { display: block; }
  .pet[data-state="working"] .mouth-smile { display: none; }
  .pet[data-state="working"] .mouth-focus { display: block; }
  .pet[data-state="working"] .orb-spark { opacity: 1; }
  .pet[data-state="waiting"] #head { animation: tilt 2.8s ease-in-out infinite; }
  .pet[data-state="waiting"] .ear-r { animation: ear-twitch 2.8s ease-in-out infinite; }
  .pet[data-state="celebrate"] .art { animation: cheer .85s ease-in-out 4; }
  .pet[data-state="celebrate"] .eyes-open { display: none; }
  .pet[data-state="celebrate"] .eyes-closed { display: block; }
  .pet[data-state="celebrate"] .mouth-smile { display: none; }
  .pet[data-state="celebrate"] .mouth-grin { display: block; }
  .pet[data-state="celebrate"] .sparkles { opacity: 1; animation: fade 1.2s ease-in-out infinite; }
  .pet[data-state="celebrate"] .petals g { animation-duration: 2.4s; }
  .pet[data-state="sleeping"] .eyes-open { display: none; }
  .pet[data-state="sleeping"] .eyes-closed { display: block; }
  .pet[data-state="sleeping"] .art { animation: sleep 6.4s ease-in-out infinite; }
  .pet[data-state="sleeping"] .zzz { opacity: 1; }
  .eyes-closed, .mouth-focus, .mouth-grin, .brows-focus, .zzz, .question { display: none; }
  .pet[data-state="waiting"] .question { display: block; animation: pop 2.8s ease-in-out infinite; }
  .sparkles { opacity: 0; }

  .bubble {
    position: absolute; left: 50%; top: 92px; transform: translateX(-50%);
    padding: 10px 16px; border-radius: 16px 16px 16px 6px;
    background: #fffdfbF4; color: #5d3d4b; font-size: 13px; font-weight: 550;
    box-shadow: 0 10px 24px #7d4c6526, inset 0 0 0 .5px #ffffffcc; white-space: nowrap;
  }
  .bubble::after { content: ""; position: absolute; left: 26px; bottom: -5px; width: 10px; height: 10px; background: inherit; border-radius: 2px; transform: rotate(45deg); }

  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.02); } }
  @keyframes hair { 0%,100% { transform: rotate(-.7deg); } 50% { transform: rotate(1.1deg); } }
  @keyframes tail { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
  @keyframes head { 0%,100% { transform: rotate(-.5deg); } 50% { transform: rotate(.7deg); } }
  @keyframes sleeves { 0%,100% { transform: rotate(0); } 50% { transform: rotate(1.1deg); } }
  @keyframes ear-l { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-3deg); } }
  @keyframes ear-r { 0%,100% { transform: rotate(0); } 50% { transform: rotate(3deg); } }
  @keyframes ear-twitch { 0%,80%,100% { transform: rotate(0); } 86% { transform: rotate(-10deg); } 92% { transform: rotate(4deg); } }
  @keyframes blink { 0%,92%,96%,100% { transform: scaleY(1); } 93.6%,94.6% { transform: scaleY(.06); } }
  @keyframes petal { 0%,100% { transform: translate(0,0) rotate(0); opacity: .55; } 50% { transform: translate(6px,-14px) rotate(24deg); opacity: 1; } }
  @keyframes orb { 0%,100% { opacity: .55; transform: scale(.94); } 50% { opacity: .95; transform: scale(1.06); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes work { 0%,100% { transform: translateY(0) rotate(-.3deg); } 50% { transform: translateY(-2px) rotate(.2deg); } }
  @keyframes tilt { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(-7deg); } }
  @keyframes pop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes cheer { 0%,100% { transform: translateY(0) rotate(-2deg); } 40% { transform: translateY(-18px) rotate(3deg); } 70% { transform: translateY(-4px) rotate(-1deg); } }
  @keyframes fade { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
  @keyframes sleep { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(2px) scaleY(.995); } }
</style>
</head>
<body>
<div class="stage">
  <div class="tag"><b>示例 A · Q 版狐娘</b>狐耳 · 金发 · 粉白巫女服 · 红腰带 · 铃铛 · 灵珠<span> 2.5D 分层 / 可动 / 可分割</span></div>

  <div class="pet" id="pet" data-state="idle">
    <div class="bubble" id="bubble">今天也一起加油吧～</div>
    <svg class="art" viewBox="0 0 240 320" role="img" aria-label="狐娘小铃">
      <defs>
        <linearGradient id="hairGrad" x1="0" y1="0" x2=".35" y2="1">
          <stop offset="0" stop-color="#fffaf0"/><stop offset=".45" stop-color="#ffe49a"/><stop offset="1" stop-color="#e0ad55"/>
        </linearGradient>
        <linearGradient id="hairLight" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff8d8"/><stop offset="1" stop-color="#f0c25f"/>
        </linearGradient>
        <linearGradient id="earGrad" x1="0" y1="0" x2=".3" y2="1">
          <stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#ffe09a"/><stop offset="1" stop-color="#dea64e"/>
        </linearGradient>

          <stop offset="0" stop-color="#fff5ec"/><stop offset=".72" stop-color="#ffe3d6"/><stop offset="1" stop-color="#ffd2c2"/>
        </linearGradient>
        <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#b9fbff"/><stop offset=".35" stop-color="#62e2f6"/><stop offset=".72" stop-color="#318fdc"/><stop offset="1" stop-color="#1d3f9b"/>
        </linearGradient>
        <linearGradient id="kimono" x1="0" y1="0" x2=".2" y2="1">
          <stop offset="0" stop-color="#ffe1eb"/><stop offset=".55" stop-color="#f6aec5"/><stop offset="1" stop-color="#df789d"/>
        </linearGradient>
        <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fffdfd"/><stop offset="1" stop-color="#f5e3eb"/>
        </linearGradient>
        <linearGradient id="sleeve" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fffafa"/><stop offset=".55" stop-color="#ffe0ea"/><stop offset="1" stop-color="#f3b4ca"/>
        </linearGradient>
        <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#d94c66"/><stop offset="1" stop-color="#8f1f39"/>
        </linearGradient>
        <linearGradient id="tailGrad" x1="0" y1="0" x2=".8" y2="1">
          <stop offset="0" stop-color="#ffda9c"/><stop offset=".5" stop-color="#eead55"/><stop offset="1" stop-color="#c97a2f"/>
        </linearGradient>
        <radialGradient id="orb" cx=".38" cy=".3" r=".75">
          <stop offset="0" stop-color="#eaffff"/><stop offset=".3" stop-color="#92f6ff"/><stop offset=".7" stop-color="#339ee8"/><stop offset="1" stop-color="#16459f"/>
        </radialGradient>
        <radialGradient id="blush" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#ff9aaa" stop-opacity=".7"/><stop offset="1" stop-color="#ff9aaa" stop-opacity="0"/>
        </radialGradient>
        <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

          <path d="M157 262 C182 271 205 264 218 246" fill="none" stroke="#ffe2b0" stroke-width="1.7" opacity=".65" stroke-linecap="round"/>

            fill="url(#hairGrad)" stroke="#8a4a1e" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M70 126 C64 164 58 208 53 238 M170 126 C176 164 182 208 187 238" fill="none" stroke="#fff6d6" stroke-width="2" opacity=".4" stroke-linecap="round"/>
          <path d="M56 240 C63 244 70 240 74 232 M184 240 C177 244 170 240 166 232" fill="none" stroke="#fffbe8" stroke-width="1.4" opacity=".55" stroke-linecap="round"/>
        </g>
      </g>

      <!-- ═ 身体 ═ -->
      <g class="layer layer-body">
        <g id="body">
          <!-- neck -->
          <path d="M110 170 L130 170 L132 198 C125 203 115 203 108 198 Z" fill="url(#skin)" stroke="#dda08f" stroke-width="1"/>
          <path d="M110 177 C116 184 124 184 130 177 L130 191 C124 195 116 195 110 191 Z" fill="#f2b4a4" opacity=".45"/>

          <!-- legs -->
          <rect x="103" y="281" width="14" height="27" rx="7" fill="url(#skin)" stroke="#dda08f" stroke-width="1"/>

          <path d="M116 266 L124 270 M116 278 L124 282 M116 290 L124 294" stroke="#f6cf72" stroke-width="1" opacity=".6"/>

            <circle cx="95" cy="258" r="3.6"/><circle cx="145" cy="258" r="3.6"/><circle cx="120" cy="301" r="3.2"/>
          </g>
          <circle cx="95" cy="261" r="1" fill="#b07b22"/><circle cx="145" cy="261" r="1" fill="#b07b22"/><circle cx="120" cy="303" r=".9" fill="#b07b22"/>
          <path d="M95 261 V268 M145 261 V268" stroke="#d3a23e" stroke-width=".8"/>

      </g>

      <!-- ═ 宽袖与手 ═ -->

          <!-- brows -->

          <g class="brows-focus">
            <path d="M85 110 Q96 112 108 117" fill="none" stroke="#7a4a2a" stroke-width="2.3" stroke-linecap="round"/>
            <path d="M155 110 Q144 112 132 117" fill="none" stroke="#7a4a2a" stroke-width="2.3" stroke-linecap="round"/>
          </g>

          <!-- eyes -->
          <g class="eyes-open">
            <g class="eye">
              <ellipse cx="97" cy="138" rx="15.5" ry="17" fill="#fffdfd" stroke="#4a3550" stroke-width=".7"/>
