<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月下狐仙 · 概念示例 B</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background:
      radial-gradient(80% 60% at 76% 18%, #ffe6f0 0, transparent 58%),
      radial-gradient(90% 70% at 18% 88%, #fff1dc 0, transparent 60%),
      #f6f1f7;
    font-family: ui-sans-serif, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage { position: relative; width: 720px; height: 900px; }
  .tag { position: absolute; left: 34px; top: 28px; color: #7b6470; font-size: 12px; line-height: 1.7; letter-spacing: .04em; }
  .tag b { display: block; color: #3f2b36; font-size: 16px; letter-spacing: .08em; }
  .tag span { color: #b08d9d; }

  .pet { position: absolute; left: 50%; top: 51%; transform: translate(-50%, -50%); width: 300px; }
  .frame {
    position: relative; width: 300px; height: 390px; padding: 10px;
    border-radius: 48% 48% 46% 46% / 40% 40% 60% 60%;
    background: linear-gradient(150deg, #fff8e8, #f3c777 35%, #c98c3f 55%, #ffe9b8 78%, #a96f2d);
    box-shadow: 0 26px 40px #5b345326, 0 0 0 1px #ffffffb3 inset, 0 0 34px #ffd98f59;
    animation: float 6s ease-in-out infinite;
  }
  .frame::before {
    content: ""; position: absolute; inset: -22px; border-radius: inherit;
    background: radial-gradient(ellipse at 50% 48%, #ffe7a84d, transparent 68%);
    filter: blur(12px); z-index: -1;
  }
  .window {
    width: 100%; height: 100%; overflow: hidden;
    border-radius: 48% 48% 46% 46% / 40% 40% 60% 60%;
    background: #101a36; position: relative;
  }
  .window img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 24%; filter: saturate(1.06) contrast(1.02); }
  .window::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: inset 0 0 30px #0a0e2259, inset 0 0 0 1px #ffffff1f;
  }
  .rim { position: absolute; inset: 18px; border-radius: inherit; border: 1px solid #ffe9b59c; pointer-events: none; }
  .rim::after { content: ""; position: absolute; inset: 5px; border-radius: inherit; border: 1px dashed #ffffff3d; }

  .charm {
    position: absolute; left: 50%; top: -24px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 2px; color: #b07b2d;
  }
  .charm .knot { width: 24px; height: 14px; border-radius: 50%; background: linear-gradient(#e05a72, #a92a45); box-shadow: 0 2px 4px #7f1d2f40; }
  .charm .line { width: 1px; height: 24px; background: linear-gradient(#b07b2d, transparent); }
  .charm .bell { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c0, #e7b34b 60%, #a87522); box-shadow: 0 1px 3px #6d4b1233; }

  .name {
    position: absolute; left: 50%; bottom: -22px; transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px;
    border-radius: 99px; background: #fffaf3f2; color: #8d5a2e;
    font-size: 12px; font-weight: 650; letter-spacing: .14em; white-space: nowrap;
    box-shadow: 0 6px 16px #7d4c652e, inset 0 0 0 .5px #ffffffcc;
  }
  .name i { width: 6px; height: 6px; border-radius: 50%; background: #64dceb; box-shadow: 0 0 6px #64dceb; }

  .bubble {
    position: absolute; z-index: 3; left: -86px; top: 38px; padding: 10px 15px; border-radius: 16px 16px 16px 6px;
    background: #fffdfbee; color: #5d3d4b; font-size: 13px; font-weight: 550; white-space: nowrap;
    box-shadow: 0 10px 24px #7d4c6526, inset 0 0 0 .5px #ffffffcc;
  }
  .bubble::after { content: ""; position: absolute; left: 24px; bottom: -5px; width: 10px; height: 10px; background: inherit; border-radius: 2px; transform: rotate(45deg); }

  .petals { position: absolute; inset: 0; pointer-events: none; }
  .petals i { position: absolute; width: 10px; height: 6px; border-radius: 70% 30% 70% 30%; background: #ffc0d2; opacity: .8; animation: petal 7s ease-in-out infinite; }
  .petals i:nth-child(1) { left: 8%; top: 20%; }
  .petals i:nth-child(2) { right: 6%; top: 14%; width: 8px; animation-delay: -2.2s; }
  .petals i:nth-child(3) { right: 0; top: 55%; animation-delay: -4.4s; }
  .petals i:nth-child(4) { left: 2%; top: 68%; width: 7px; animation-delay: -1.4s; }
  .petals i:nth-child(5) { right: 18%; top: 82%; width: 9px; animation-delay: -3.2s; }

  .caption {
    position: absolute; left: 50%; top: calc(100% + 58px); transform: translateX(-50%);
    color: #8b7180; font-size: 11px; letter-spacing: .12em; white-space: nowrap;
  }
  .caption b { color: #5f4350; font-weight: 600; }

  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes petal { 0%,100% { transform: translate(0,0) rotate(0); opacity: .45; } 50% { transform: translate(8px,-18px) rotate(32deg); opacity: 1; } }
</style>
</head>
<body>
<div class="stage">
  <div class="tag"><b>示例 B · 月下狐仙挂件</b>保留原图气质 · 月光画框 · 灵珠微光<span> 静态立绘 / 轻动画 / 不做全身分层</span></div>

  <div class="pet">
    <div class="bubble">今天也一起加油吧～</div>
    <div class="frame">
      <div class="window">
        <img src="./ref-1.jpg" alt="月下狐仙参考图">
      </div>
      <div class="rim"></div>
      <div class="charm"><span class="knot"></span><span class="line"></span><span class="bell"></span></div>
      <div class="name"><i></i>月狐 · 小铃</div>
    </div>
    <div class="petals"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="caption"><b>低风险</b> · 直接使用现有立绘，保留原图氛围；但只有呼吸/光效，不能做身体分层与动作</div>
  </div>
</div>
</body>
</html>
